# Samuda Growth Hub - rebuild data.json from the Excel files in the repository (dump + product master + customer master)
# and publish the dashboard to GitHub Pages after every upload or change.
name: Update dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Look for Excel files
        id: wb
        run: |
          shopt -s nullglob
          files=(*.xlsx *.xlsm)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#files[@]}" -gt 0 ]; then echo "Excel files found:"; printf '  %s\n' "${files[@]}"; else echo "No Excel file in the repository - publishing the uploaded data.json as it is."; fi

      - name: Set up Python
        if: steps.wb.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build data.json from the Excel files
        if: steps.wb.outputs.count != '0'
        run: |
          pip install --quiet pandas openpyxl
          python build_data.py

      - name: Save the new data.json in the repository
        if: steps.wb.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data.json from Excel files" && git push)

      - name: Collect the files to publish
        run: |
          mkdir _site
          cp index.html data.json _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
