# Samuda Growth Hub - rebuild data.json (when an Excel workbook is in the repository)
# and publish the dashboard to GitHub Pages after every upload or change.
name: Update dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Look for an Excel workbook
        id: wb
        run: |
          f=$(ls -t *.xlsx 2>/dev/null | head -n 1 || true)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          if [ -n "$f" ]; then echo "Workbook found: $f"; else echo "No workbook in the repository - publishing the uploaded data.json as it is."; fi

      - name: Set up Python
        if: steps.wb.outputs.file != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build data.json from the workbook
        if: steps.wb.outputs.file != ''
        run: |
          pip install --quiet pandas openpyxl
          python build_data.py "${{ steps.wb.outputs.file }}" data.json

      - name: Save the new data.json in the repository
        if: steps.wb.outputs.file != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data.json from workbook" && git push)

      - name: Collect the files to publish
        run: |
          mkdir _site
          cp index.html data.json _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
