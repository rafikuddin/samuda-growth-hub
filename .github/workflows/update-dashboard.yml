# Samuda Growth Hub - publish the dashboard page to GitHub Pages after every change.
# The data itself is not here: it is served by the Google Apps Script after sign-in (see README).
name: Publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the repository
        run: |
          # Only index.html and config.json are ever published. These checks just warn about things that should not be in a public repository.
          for f in data.json *.xlsx *.xls *.csv sheets.txt; do
            if [ -e "$f" ]; then echo "::warning::$f is in the repository. It is NOT published, but anyone can read it on GitHub. Delete it."; fi
          done
          if [ ! -f config.json ]; then echo "::error::config.json is missing (it holds the link of the sign-in service)."; exit 1; fi
          if grep -q "script.google.com" config.json; then echo "::warning::config.json holds the Apps Script link. Put the Cloudflare Worker link there instead (README, Part 4)."; fi

      - name: Collect the files to publish
        run: |
          mkdir _site
          cp index.html config.json _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
