# Samuda Growth Hub - publish the dashboard page to GitHub Pages after every change.
# The data itself is not here: it is served by the Google Apps Script after sign-in (see README).
name: Publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the files to publish
        run: |
          mkdir _site
          cp index.html _site/
          if [ -f config.json ]; then cp config.json _site/; fi
          if [ -f data.json ]; then cp data.json _site/; fi
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
